[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propfirm_engine"
version = "0.4.0"
description = "A research simulator for futures prop-firm strategies, sizing policies and repeated-attempt economics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/propfirm_engine"]

[tool.hatch.build.targets.sdist]
only-include = ["src/propfirm_engine", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
