name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python dashboard/build_pages.py
      - run: git diff --exit-code -- docs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_dashboard_browser.py -q
        env:
          RUN_BROWSER_TESTS: '1'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_package.py -q
        env:
          RUN_PACKAGE_TESTS: '1'

  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]" numpy==1.26.4 numba==0.59.1
      - run: python -m pytest -q

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python benchmarks/research.py --repeat 3 --cold > performance.json
      - name: Check recording overhead
        run: |
          python -c 'import json; r=json.load(open("performance.json"))["results"]; assert r["quote_search"]["peak_python_bytes"] < .85*r["quote_research"]["peak_python_bytes"]; assert r["quote_search"]["warm_median_seconds"] < 2.5*r["quote_research"]["warm_median_seconds"]'
      - uses: actions/upload-artifact@v4
        with:
          name: performance
          path: performance.json

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,research]"
      - run: python -c "import duckdb, pandas, pandas_market_calendars"
      - run: python -m pytest tests/test_open_long_data.py tests/test_zero_drift.py -q -rs
